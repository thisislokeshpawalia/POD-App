providers = ["...", "python"]
[phases.setup]
  # "..." extends the default packages selected by Nixpacks based on the provider
  # Add ffmpeg since we use it for media processing
  aptPkgs = ["...", "ffmpeg"]

[start]
  # Explicit start command to run the FastAPI app via Uvicorn
  cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
